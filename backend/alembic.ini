# Alembic configuration (step 02).
#
# ASCII ONLY. Alembic reads this file with encoding="locale" (see
# alembic/util/compat.py::read_config_parser), so non-ASCII bytes raise
# UnicodeDecodeError on machines whose locale is not UTF-8 -- e.g. GBK on the
# Chinese Windows this project is developed on. Project notes in Chinese live in
# migrations/README, migrations/env.py and backend/README.md instead.
#
# Entry points (run from the backend/ directory):
#   python -m alembic upgrade head          # migrate to latest
#   python -m alembic current               # show current revision
#   python -m alembic revision -m "note"    # new revision (tables land per feature step)
#   python -m alembic -x db_url=sqlite:////tmp/t.db upgrade head   # throwaway database
#
# Paths resolve against this file's directory (%(here)s), not the shell's
# working directory, so any subdirectory reaches the same migration scripts.

[alembic]
script_location = %(here)s/migrations

# Date-prefixed revision filenames keep versions/ in chronological order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Lets env.py import src.*. %(here)s rather than "." so it does not depend on
# which directory the command is run from.
prepend_sys_path = %(here)s

path_separator = os

# The connection string is deliberately NOT stored here. migrations/env.py reads
# DATABASE_URL (from .env or the process environment) and resolves relative
# SQLite paths against backend/, so the app and the migrations always touch the
# same database. Override temporarily with `-x db_url=...`; never paste a real
# connection string here, since that would ship a password with the source.

# Logging below is applied by env.py only when it runs as a standalone command;
# programmatic callers keep their own logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
